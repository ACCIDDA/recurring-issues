# See: https://github.com/licensee/licensed/blob/main/docs/configuration.md

sources:
  npm: true

allowed:
  - '0bsd'
  - 'apache-2.0'
  - 'bsd-2-clause'
  - 'bsd-3-clause'
  - 'cc0-1.0'
  - 'isc'
  - 'mit'
  - 'other'

ignored:
  npm:
    # Used by Rollup.js when building in GitHub Actions
    - '@rollup/rollup-linux-x64-gnu'
